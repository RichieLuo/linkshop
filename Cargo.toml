[package]
name = "linkshop"
version = "1.0.1"
edition = "2024"
rust-version = "1.89"
description = "A local-first API debugging client"

[package.metadata.shop]
product-name = "LinkShop"

[dependencies]
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "persistence", "x11", "wayland"] }
reqwest = { version = "0.12", features = ["blocking", "native-tls", "gzip", "brotli", "deflate"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
ron = "0.11"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = ["Win32_Graphics_Dwm", "Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "windows")'.build-dependencies]
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
winres = "0.1"

[profile.dev]
incremental = false

[profile.release]
lto = "thin"
strip = true
